<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PM Interview Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .interview-setup {
            margin-bottom: 30px;
        }

        .interview-setup label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .interview-setup select,
        .interview-setup input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status-indicator.idle {
            background: #f0f0f0;
            color: #666;
        }

        .status-indicator.listening {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-indicator.processing {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-indicator.speaking {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .idle .status-dot { background: #999; }
        .listening .status-dot { background: #1976d2; }
        .processing .status-dot { background: #f57c00; }
        .speaking .status-dot { background: #388e3c; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .conversation {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
        }

        .message.ai {
            background: #e3f2fd;
            color: #1565c0;
        }

        .message.user {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .message .role {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .question-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .question-actions button {
            flex: 1;
            padding: 9px 14px;
            border: 1.5px solid #c4b5fd;
            border-radius: 7px;
            background: white;
            color: #5b21b6;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .question-actions button:hover:not(:disabled) {
            background: #f5f3ff;
            border-color: #7c3aed;
        }

        .question-actions button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .start-btn {
            background: #667eea;
            color: white;
        }

        .start-btn:hover:not(:disabled) {
            background: #5568d3;
        }

        .speak-btn {
            background: #1976d2;
            color: white;
        }

        .speak-btn:hover:not(:disabled) {
            background: #1565c0;
        }

        .speak-btn.recording {
            background: #f44336;
            animation: pulse-button 1s infinite;
        }

        @keyframes pulse-button {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .end-btn {
            background: #f44336;
            color: white;
        }

        .end-btn:hover:not(:disabled) {
            background: #d32f2f;
        }

        .evaluation-btn {
            background: #4caf50;
            color: white;
        }

        .evaluation-btn:hover:not(:disabled) {
            background: #388e3c;
        }

        .transcript {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
            min-height: 60px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .hidden {
            display: none;
        }

        .framework-toggle {
            background: none;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            flex: none;
            width: auto;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .framework-toggle:hover {
            background: #667eea;
            color: white;
        }

        .framework-panel {
            background: #f5f3ff;
            border: 1px solid #c4b5fd;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .framework-panel h3 {
            color: #5b21b6;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .framework-steps {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .framework-step {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .step-letter {
            background: #7c3aed;
            color: white;
            border-radius: 4px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .step-text {
            color: #4c1d95;
            line-height: 1.4;
            padding-top: 2px;
        }

        .sample-answer-panel {
            background: #f0fdf4;
            border: 1.5px solid #86efac;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .sample-answer-panel h3 {
            color: #15803d;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
        }

        .sample-key-points {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .sample-key-points li {
            color: #166534;
            line-height: 1.4;
            padding-left: 4px;
            list-style: none;
            display: flex;
            gap: 7px;
        }

        .sample-key-points li::before {
            content: '✓';
            color: #16a34a;
            font-weight: 700;
            flex-shrink: 0;
        }

        .sample-walkthrough {
            border-top: 1px solid #bbf7d0;
            padding-top: 10px;
            margin-top: 4px;
        }

        .sample-walkthrough-toggle {
            background: none;
            border: none;
            color: #15803d;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            flex: none;
            width: auto;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .sample-walkthrough-steps {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .sample-step {
            color: #166534;
            line-height: 1.5;
            font-size: 13px;
            padding-left: 4px;
            border-left: 2px solid #86efac;
            padding-left: 10px;
        }

        /* ── Landing screen ── */
        .landing-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }

        .landing-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px 22px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            text-align: left;
            width: 100%;
        }

        .landing-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 14px rgba(102,126,234,0.15);
        }

        .landing-card.primary {
            border-color: #667eea;
            background: #f5f3ff;
        }

        .landing-card h2 {
            font-size: 17px;
            font-weight: 700;
            color: #222;
            margin-bottom: 4px;
        }

        .landing-card p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .landing-card .card-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .tag-start { background: #ede9fe; color: #5b21b6; }
        .tag-practice { background: #dcfce7; color: #15803d; }

        /* ── Study screen ── */
        .study-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            background: none;
            border: 1.5px solid #d1d5db;
            color: #555;
            padding: 7px 14px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            flex: none;
            width: auto;
            transition: all 0.2s;
        }

        .back-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .study-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #222;
            margin: 0;
        }

        .round-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .round-card {
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .round-card.open {
            border-color: #a78bfa;
        }

        .round-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 16px;
            cursor: pointer;
            background: white;
            transition: background 0.15s;
        }

        .round-card-header:hover {
            background: #fafafa;
        }

        .round-card.open .round-card-header {
            background: #f5f3ff;
        }

        .round-card-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .round-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .round-card-name {
            font-size: 14px;
            font-weight: 700;
            color: #222;
        }

        .round-card-framework {
            font-size: 11px;
            color: #888;
            font-weight: 500;
            margin-top: 1px;
        }

        .round-chevron {
            font-size: 12px;
            color: #aaa;
            transition: transform 0.2s;
        }

        .round-card.open .round-chevron {
            transform: rotate(180deg);
        }

        .round-card-body {
            display: none;
            padding: 0 16px 16px;
            background: #fdfcff;
            border-top: 1px solid #ede9fe;
        }

        .round-card.open .round-card-body {
            display: block;
        }

        .round-section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #7c3aed;
            margin: 14px 0 7px;
        }

        .round-steps {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .round-step {
            display: flex;
            gap: 9px;
            align-items: flex-start;
        }

        .round-step-badge {
            background: #7c3aed;
            color: white;
            border-radius: 4px;
            min-width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            flex-shrink: 0;
            padding: 0 3px;
        }

        .round-step-text {
            font-size: 13px;
            color: #374151;
            line-height: 1.5;
            padding-top: 3px;
        }

        .antipatterns {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .antipattern {
            font-size: 13px;
            color: #b91c1c;
            display: flex;
            gap: 7px;
            line-height: 1.4;
        }

        .antipattern::before {
            content: '✗';
            font-weight: 700;
            flex-shrink: 0;
        }

        .study-cta {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .study-cta:hover {
            background: #5568d3;
        }

        /* ── Deconstruction quiz ── */
        .dq-question {
            background: var(--bg-secondary, #f3f4f6);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            color: #222;
            line-height: 1.5;
            margin-bottom: 18px;
            border-left: 3px solid #7c3aed;
        }

        .dq-progress {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .dq-dot {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: #e5e7eb;
            transition: background 0.3s;
        }

        .dq-dot.active { background: #7c3aed; }
        .dq-dot.done { background: #16a34a; }

        .dq-stage-prompt {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 10px;
        }

        .dq-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .dq-option {
            padding: 11px 14px;
            border-radius: 8px;
            border: 1.5px solid #e5e7eb;
            background: white;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            line-height: 1.4;
        }

        .dq-option:hover:not(:disabled) {
            border-color: #7c3aed;
            background: #f5f3ff;
        }

        .dq-option.correct {
            border-color: #16a34a;
            background: #f0fdf4;
            color: #15803d;
            font-weight: 600;
        }

        .dq-option.wrong {
            border-color: #e5e7eb;
            background: #f9fafb;
            color: #9ca3af;
            text-decoration: line-through;
        }

        .dq-option:disabled { cursor: default; }

        .dq-reveal {
            background: #f5f3ff;
            border-radius: 8px;
            padding: 11px 13px;
            font-size: 12px;
            color: #4c1d95;
            line-height: 1.5;
            margin-bottom: 14px;
            border-left: 3px solid #7c3aed;
        }

        .dq-next-btn {
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .dq-next-btn:hover { background: #6d28d9; }

        .dq-opening {
            background: #ede9fe;
            border-radius: 10px;
            padding: 14px;
            margin-top: 16px;
        }

        .dq-opening-label {
            font-size: 11px;
            font-weight: 700;
            color: #7c3aed;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 6px;
        }

        .dq-opening-text {
            font-size: 13px;
            color: #4c1d95;
            line-height: 1.55;
            font-style: italic;
        }

        .dq-nav {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .dq-nav button {
            flex: 1;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .dq-nav .dq-retry {
            background: white;
            border: 1.5px solid #e5e7eb;
            color: #374151;
        }

        .dq-nav .dq-next-q {
            background: #7c3aed;
            border: none;
            color: white;
        }

        /* ── Mode toggle in setup ── */
        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 8px;
            border-radius: 8px;
            border: 1.5px solid #e5e7eb;
            background: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #374151;
            transition: all 0.15s;
        }

        .mode-btn.active {
            border-color: #7c3aed;
            background: #f5f3ff;
            color: #5b21b6;
        }

        /* ── Guided progress tracker ── */
        .progress-tracker {
            background: #f5f3ff;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .progress-tracker-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #7c3aed;
            margin-bottom: 10px;
        }

        .pt-steps {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pt-step {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .pt-badge {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .pt-badge.done { background: #dcfce7; color: #15803d; }
        .pt-badge.current { background: #7c3aed; color: white; }
        .pt-badge.pending { background: #e5e7eb; color: #9ca3af; }

        .pt-text {
            font-size: 12px;
            color: #374151;
        }

        .pt-text.done { color: #9ca3af; text-decoration: line-through; }
        .pt-text.current { font-weight: 700; color: #5b21b6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI PM Interview Practice</h1>
        <p class="subtitle">Voice-only practice with real big tech interview questions</p>

        <div id="error" class="error hidden"></div>

        <!-- Landing screen -->
        <div id="landing">
            <div class="landing-options">
                <button class="landing-card" onclick="showStudy()">
                    <div class="card-tag tag-start">Step 1</div>
                    <h2>Study Frameworks</h2>
                    <p>Learn the 7 round types, frameworks, and anti-patterns. Takes 5–10 min.</p>
                </button>
                <button class="landing-card" onclick="showDeconstruct()">
                    <div class="card-tag" style="background:#dcfce7;color:#15803d;">Step 2 — New</div>
                    <h2>Question Deconstruction</h2>
                    <p>Practice reading questions — recognize type, pick framework, spot the hidden test.</p>
                </button>
                <button class="landing-card" onclick="showSetup()">
                    <div class="card-tag tag-practice">Step 3</div>
                    <h2>Mock Interview</h2>
                    <p>Voice-only practice with AI feedback. Choose guided coaching or full simulation.</p>
                </button>
            </div>
        </div>

        <!-- Study screen -->
        <div id="study" class="hidden">
            <div class="study-header">
                <button class="back-btn" onclick="showLanding()">Back</button>
                <h2>AI PM Interview Rounds</h2>
            </div>
            <div class="round-cards" id="roundCards"></div>
            <button class="study-cta" onclick="showDeconstruct()">Practice deconstruction</button>
        </div>

        <!-- Deconstruction screen -->
        <div id="deconstruct" class="hidden">
            <div class="study-header">
                <button class="back-btn" onclick="showLanding()">Back</button>
                <h2>Question Deconstruction</h2>
            </div>
            <div id="deconstructCard"></div>
        </div>

        <!-- Interview Setup -->
        <div id="setup" class="interview-setup hidden">
            <label>Practice mode:</label>
            <div class="mode-toggle">
                <button class="mode-btn active" id="modeGuided" onclick="setMode('guided')">Guided coaching</button>
                <button class="mode-btn" id="modeMock" onclick="setMode('mock')">Full simulation</button>
            </div>

            <label for="interviewType">Select Interview Type:</label>
            <select id="interviewType">
                <option value="">Choose interview type...</option>
                <option value="Product Sense">Product Sense</option>
                <option value="Product Design">Product Design</option>
                <option value="Product Strategy">Product Strategy</option>
                <option value="Metrics & Analytics">Metrics & Analytics</option>
                <option value="Behavioral">Behavioral</option>
                <option value="Product Execution">Product Execution</option>
                <option value="Technical PM">Technical PM</option>
                <option value="AI Safety">AI Safety</option>
            </select>

            <label for="candidateName">Your Name (optional):</label>
            <input type="text" id="candidateName" placeholder="Enter your name">

            <button class="start-btn" onclick="startInterview()">Start Interview</button>
            <button class="back-btn" style="margin-top:8px;width:100%;text-align:center;" onclick="showLanding()">Back</button>
        </div>

        <!-- Interview Interface (hidden initially) -->
        <div id="interview" class="hidden">
            <div id="progressTracker" class="progress-tracker hidden">
                <div class="progress-tracker-label">Framework progress</div>
                <div class="pt-steps" id="ptSteps"></div>
            </div>

        function startDeconstruct(roundType) {
            if (roundType) {
                const idx = DECONSTRUCT_QUESTIONS.findIndex(q => q.roundType === roundType);
                dqIndex = idx >= 0 ? idx : 0;
            } else {
                dqIndex = 0;
            }
            dqStage = 0;
            dqSelected = false;
            renderDeconstructCard();
        }

        function renderDeconstructCard() {
            const q = DECONSTRUCT_QUESTIONS[dqIndex];
            const container = document.getElementById('deconstructCard');
            while (container.firstChild) container.removeChild(container.firstChild);

            const dots = document.createElement('div');
            dots.className = 'dq-progress';
            DECONSTRUCT_QUESTIONS.forEach((_, i) => {
                const d = document.createElement('div');
                d.className = 'dq-dot' + (i < dqIndex ? ' done' : i === dqIndex ? ' active' : '');
                dots.appendChild(d);
            });
            container.appendChild(dots);

            const qEl = document.createElement('div');
            qEl.className = 'dq-question';
            qEl.textContent = q.question;
            container.appendChild(qEl);

            for (let i = 0; i < dqStage; i++) {
                const s = q.stages[i];
                const correct = s.options.find(o => o.correct);
                const summary = document.createElement('div');
                summary.style.cssText = 'font-size:12px;color:#16a34a;margin-bottom:8px;display:flex;gap:6px;align-items:flex-start;';
                const check = document.createElement('span');
                check.textContent = '✓';
                check.style.fontWeight = '700';
                const txt = document.createElement('span');
                txt.textContent = correct.text;
                summary.appendChild(check);
                summary.appendChild(txt);
                container.appendChild(summary);
            }

            if (dqStage < q.stages.length) {
                renderStage(q, dqStage, container);
            } else {
                renderReveal(q, container);
            }
        }

        function renderStage(q, stageIdx, container) {
            const stage = q.stages[stageIdx];
            const prompt = document.createElement('div');
            prompt.className = 'dq-stage-prompt';
            prompt.textContent = stage.prompt;
            container.appendChild(prompt);

            const opts = document.createElement('div');
            opts.className = 'dq-options';
            stage.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'dq-option';
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(btn, opt.correct, stage, opts, container);
                opts.appendChild(btn);
            });
            container.appendChild(opts);
        }

        function selectOption(btn, isCorrect, stage, optsContainer, card) {
            if (dqSelected) return;
            dqSelected = true;
            Array.from(optsContainer.children).forEach(b => {
                b.disabled = true;
                const isThisCorrect = stage.options.find(o => o.text === b.textContent).correct;
                if (isThisCorrect) b.classList.add('correct');
                else if (b === btn && !isCorrect) b.classList.add('wrong');
            });
            const reveal = document.createElement('div');
            reveal.className = 'dq-reveal';
            reveal.textContent = stage.reveal;
            card.appendChild(reveal);

            const nextBtn = document.createElement('button');
            nextBtn.className = 'dq-next-btn';
            const isLastStage = dqStage >= DECONSTRUCT_QUESTIONS[dqIndex].stages.length - 1;
            nextBtn.textContent = isLastStage ? 'See how to open this answer' : 'Next';
            nextBtn.onclick = () => { dqStage++; dqSelected = false; renderDeconstructCard(); };
            card.appendChild(nextBtn);
        }

        function renderReveal(q, container) {
            const opening = document.createElement('div');
            opening.className = 'dq-opening';
            const lbl = document.createElement('div');
            lbl.className = 'dq-opening-label';
            lbl.textContent = 'How to open this answer';
            const txt = document.createElement('div');
            txt.className = 'dq-opening-text';
            txt.textContent = q.openingLine;
            opening.appendChild(lbl);
            opening.appendChild(txt);
            container.appendChild(opening);

            const nav = document.createElement('div');
            nav.className = 'dq-nav';
            const retry = document.createElement('button');
            retry.className = 'dq-retry';
            retry.textContent = 'Retry';
            retry.onclick = () => { dqStage = 0; dqSelected = false; renderDeconstructCard(); };
            const nextQ = document.createElement('button');
            nextQ.className = 'dq-next-q';
            const isLast = dqIndex >= DECONSTRUCT_QUESTIONS.length - 1;
            nextQ.textContent = isLast ? 'Start mock interview' : 'Next question';
            nextQ.onclick = () => {
                if (isLast) showSetup();
                else { dqIndex++; dqStage = 0; dqSelected = false; renderDeconstructCard(); }
            };
            nav.appendChild(retry);
            nav.appendChild(nextQ);
            container.appendChild(nav);
        }

        // ── Guided progress tracker ──
        let guidedFramework = null;

        function initProgressTracker(framework) {
            guidedFramework = framework;
            const tracker = document.getElementById('progressTracker');
            const stepsEl = document.getElementById('ptSteps');
            while (stepsEl.firstChild) stepsEl.removeChild(stepsEl.firstChild);
            tracker.classList.remove('hidden');
            framework.steps.forEach(([letter, desc], i) => {
                const row = document.createElement('div');
                row.className = 'pt-step';
                row.id = 'pt-step-' + i;
                const badge = document.createElement('div');
                badge.className = 'pt-badge ' + (i === 0 ? 'current' : 'pending');
                badge.textContent = i === 0 ? letter : (i + 1).toString();
                const text = document.createElement('div');
                text.className = 'pt-text ' + (i === 0 ? 'current' : '');
                text.textContent = letter + ' — ' + desc;
                row.appendChild(badge);
                row.appendChild(text);
                stepsEl.appendChild(row);
            });
        }

        function updateProgressTracker(stepLetter) {
            if (!guidedFramework) return;
            const idx = guidedFramework.steps.findIndex(([l]) => l === stepLetter);
            if (idx < 0) return;
            guidedFramework.steps.forEach(([letter], i) => {
                const row = document.getElementById('pt-step-' + i);
                if (!row) return;
                const badge = row.querySelector('.pt-badge');
                const text = row.querySelector('.pt-text');
                badge.className = 'pt-badge ' + (i < idx ? 'done' : i === idx ? 'current' : 'pending');
                text.className = 'pt-text ' + (i < idx ? 'done' : i === idx ? 'current' : '');
                badge.textContent = i < idx ? '✓' : i === idx ? letter : (i + 1).toString();
            });
        }

        function parseStepFromResponse(text) {
            const match = text.match(/^\[STEP:([^\]]+)\]/);
            return match ? match[1] : null;
        }

        function stripStepMarker(text) {
            return text.replace(/^\[STEP:[^\]]+\]\s*/, '');
        }

        function buildRoundCards() {
            const container = document.getElementById('roundCards');
            if (container.childElementCount > 0) return; // already built
            ROUND_DATA.forEach((round, i) => {
                const card = document.createElement('div');
                card.className = 'round-card';

                // Header
                const header = document.createElement('div');
                header.className = 'round-card-header';
                header.onclick = () => card.classList.toggle('open');

                const iconDiv = document.createElement('div');
                iconDiv.className = 'round-icon';
                iconDiv.style.background = round.color;
                iconDiv.textContent = round.icon;

                const titleDiv = document.createElement('div');
                const nameEl = document.createElement('div');
                nameEl.className = 'round-card-name';
                nameEl.textContent = round.name;
                const fwEl = document.createElement('div');
                fwEl.className = 'round-card-framework';
                fwEl.textContent = round.framework;
                titleDiv.appendChild(nameEl);
                titleDiv.appendChild(fwEl);

                const chevron = document.createElement('div');
                chevron.className = 'round-chevron';
                chevron.textContent = '▼';

                const titleRow = document.createElement('div');
                titleRow.className = 'round-card-title';
                titleRow.appendChild(iconDiv);
                titleRow.appendChild(titleDiv);

                header.appendChild(titleRow);
                header.appendChild(chevron);

                // Body
                const body = document.createElement('div');
                body.className = 'round-card-body';

                const stepsLabel = document.createElement('div');
                stepsLabel.className = 'round-section-label';
                stepsLabel.textContent = 'Framework steps';
                body.appendChild(stepsLabel);

                const stepsDiv = document.createElement('div');
                stepsDiv.className = 'round-steps';
                round.steps.forEach(([letter, desc]) => {
                    const step = document.createElement('div');
                    step.className = 'round-step';
                    const badge = document.createElement('div');
                    badge.className = 'round-step-badge';
                    badge.textContent = letter;
                    const text = document.createElement('div');
                    text.className = 'round-step-text';
                    text.textContent = desc;
                    step.appendChild(badge);
                    step.appendChild(text);
                    stepsDiv.appendChild(step);
                });
                body.appendChild(stepsDiv);

                const apLabel = document.createElement('div');
                apLabel.className = 'round-section-label';
                apLabel.textContent = 'Anti-patterns to avoid';
                body.appendChild(apLabel);

                const apDiv = document.createElement('div');
                apDiv.className = 'antipatterns';
                round.antipatterns.forEach(ap => {
                    const el = document.createElement('div');
                    el.className = 'antipattern';
                    el.textContent = ap;
                    apDiv.appendChild(el);
                });
                body.appendChild(apDiv);

                const tryBtn = document.createElement('button');
                tryBtn.style.cssText = 'margin-top:14px;width:100%;padding:9px;border-radius:8px;border:1.5px solid #7c3aed;background:white;color:#7c3aed;font-size:12px;font-weight:700;cursor:pointer;';
                tryBtn.textContent = 'Try a question';
                const rt = round.name.toLowerCase().replace(/[^a-z]/g, '-').replace(/-+/g, '-');
                const rtMap = {'behavioral':'behavioral','product-design':'product-design','product-sense':'product-sense','metrics--analytics':'metrics','product-strategy':'strategy','execution':'execution','vibe-coding':'vibe-coding','ai-safety--ethics':'ai-safety','ai-safety':'ai-safety'};
                const mapped = rtMap[rt] || rt;
                tryBtn.onclick = () => showDeconstruct(mapped);
                body.appendChild(tryBtn);

                card.appendChild(header);
                card.appendChild(body);
                container.appendChild(card);
            });
        }

        // ── Framework hints data keyed by interview type value ──
        const FRAMEWORKS = {
            'Product Design': {
                name: 'CIRCLES Method',
                steps: [
                    ['C', 'Comprehend the situation — clarify scope & constraints'],
                    ['I', 'Identify the customer — segment your users'],
                    ['R', 'Report customer needs — what pain are they feeling?'],
                    ['C', 'Cut through prioritization — pick the most important need'],
                    ['L', 'List solutions — brainstorm 3–4 options'],
                    ['E', 'Evaluate tradeoffs — effort, impact, risk'],
                    ['S', 'Summarize recommendation — one clear answer'],
                ]
            },
            'Metrics & Analytics': {
                name: 'DIGS Framework',
                steps: [
                    ['D', 'Define the goal — what is the product trying to achieve?'],
                    ['I', 'Identify metrics — north star + supporting metrics'],
                    ['G', 'Guard against gaming — what could be gamed or misleading?'],
                    ['S', 'Segment — break down by user type, platform, cohort'],
                ]
            },
            'Behavioral': {
                name: 'STAR Method',
                steps: [
                    ['S', 'Situation — set the scene with specific context'],
                    ['T', 'Task — what was your responsibility or challenge?'],
                    ['A', 'Action — what did YOU specifically do? (use "I" not "we")'],
                    ['R', 'Result — quantify the outcome; what did you learn?'],
                ]
            },
            'Product Strategy': {
                name: 'SWOT Analysis',
                steps: [
                    ['S', 'Strengths — internal advantages the company has'],
                    ['W', 'Weaknesses — internal gaps or disadvantages'],
                    ['O', 'Opportunities — external trends to capitalize on'],
                    ['T', 'Threats — external risks or competition'],
                    ['+', 'Recommendation — clear strategic direction with rationale'],
                ]
            },
            'Product Execution': {
                name: 'RICE Prioritization',
                steps: [
                    ['R', 'Reach — how many users impacted per quarter?'],
                    ['I', 'Impact — effect on core metric (1=minimal, 3=massive)'],
                    ['C', 'Confidence — % confidence in your estimates'],
                    ['E', 'Effort — person-weeks of work required'],
                    ['+', 'Score = (Reach × Impact × Confidence) / Effort'],
                ]
            },
            'Technical PM': {
                name: 'System Design',
                steps: [
                    ['1', 'Clarify scale — how many users/requests per day?'],
                    ['2', 'Define components — API, DB, cache, CDN'],
                    ['3', 'Data model — what entities and relationships?'],
                    ['4', 'Scale bottlenecks — where does it break under load?'],
                    ['5', 'Trade-offs — consistency vs. availability, SQL vs. NoSQL'],
                ]
            },
            'Product Sense': {
                name: 'AI-CUPS-PDM',
                steps: [
                    ['C', 'Context — what problem does this AI product solve?'],
                    ['U', 'Users — who benefits and who is at risk?'],
                    ['P', 'Product critique — what works and what doesn\'t?'],
                    ['S', 'Signals — what metrics prove it\'s working?'],
                    ['P', 'Priority — highest-leverage improvement'],
                    ['D', 'Differentiation — why is the AI layer essential?'],
                    ['M', 'Measure — how do you know the improvement worked?'],
                ]
            },
            'AI Safety': {
                name: 'AI-CUPS-PDM',
                steps: [
                    ['C', 'Context — what harm scenarios exist?'],
                    ['U', 'Users at risk — who is most vulnerable?'],
                    ['P', 'Prevention — model-level vs product-level controls'],
                    ['S', 'Signals — metrics that detect harm early'],
                    ['P', 'Policy — override and escalation path'],
                    ['D', 'Disclosure — what must users know?'],
                    ['M', 'Metrics — safety vs utility tradeoff'],
                ]
            },
        };

        let frameworkVisible = false;

        function toggleFramework() {
            const panel = document.getElementById('frameworkPanel');
            const btn = document.querySelector('.framework-toggle');
            frameworkVisible = !frameworkVisible;
            panel.classList.toggle('hidden', !frameworkVisible);
            btn.textContent = frameworkVisible ? 'Hide Framework Hints' : 'Show Framework Hints';
        }

        function loadFrameworkHints(interviewType) {
            const fw = FRAMEWORKS[interviewType];
            if (!fw) return;
            document.getElementById('frameworkTitle').textContent = fw.name;
            const stepsEl = document.getElementById('frameworkSteps');
            stepsEl.innerHTML = fw.steps.map(([letter, text]) => `
                <div class="framework-step">
                    <span class="step-letter">${letter}</span>
                    <span class="step-text">${text}</span>
                </div>
            `).join('');
        }
        
        // State
        let sessionId = null;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let isRecording = false;
        let currentTranscript = '';
        let accumulatedTranscript = ''; // Track all finalized speech across pauses
        let lastAiMessage = ''; // Track last AI message for repeat
        let currentQuestionId = null; // Track current question for sample answer
        let hasResponded = false; // Gate: only show sample after candidate has answered once

        // Initialize Speech Recognition
        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showError('Speech recognition not supported in this browser. Please use Chrome or Edge.');
                return false;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Accumulate finalized results
                if (finalTranscript) {
                    accumulatedTranscript += finalTranscript;
                }
                
                // Show accumulated + interim
                currentTranscript = accumulatedTranscript + interimTranscript;
                document.getElementById('transcript').textContent = currentTranscript || 'Listening...';
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                stopRecording();
            };

            recognition.onend = () => {
                if (isRecording) {
                    recognition.start();
                }
            };

            return true;
        }

        // Start Interview
        async function startInterview() {
            const interviewType = document.getElementById('interviewType').value;
            const candidateName = document.getElementById('candidateName').value;

            if (!interviewType) {
                showError('Please select an interview type');
                return;
            }

            if (!initSpeechRecognition()) {
                return;
            }

            updateStatus('processing', 'Starting interview...');

            try {
                const response = await fetch(`${API_URL}/interview/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interviewType, candidateName, mode: selectedMode })
                });

                const data = await response.json();
                sessionId = data.sessionId;
                currentQuestionId = data.currentQuestionId || null;
                hasResponded = false;

                showScreen('interview');
                const conv = document.getElementById('conversation');
                while (conv.firstChild) conv.removeChild(conv.firstChild);
                loadFrameworkHints(interviewType);

                if (selectedMode === 'guided' && data.guidedFramework) {
                    initProgressTracker(data.guidedFramework);
                } else {
                    document.getElementById('progressTracker').classList.add('hidden');
                    guidedFramework = null;
                }

                const aiText = selectedMode === 'guided' ? stripStepMarker(data.message) : data.message;
                if (selectedMode === 'guided') {
                    const step = parseStepFromResponse(data.message);
                    if (step && step !== 'done') updateProgressTracker(step);
                }
                addMessage('ai', aiText);
                speak(aiText);

                updateStatus('idle', 'Waiting for your response');

            } catch (error) {
                showError('Failed to start interview: ' + error.message);
                updateStatus('idle', 'Error');
            }
        }

        // Toggle Recording
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            currentTranscript = '';
            accumulatedTranscript = ''; // Reset for new recording
            document.getElementById('transcript').textContent = 'Listening...';
            
            recognition.start();
            isRecording = true;
            
            const speakBtn = document.getElementById('speakBtn');
            speakBtn.textContent = 'Stop';
            speakBtn.classList.add('recording');
            
            updateStatus('listening', 'Listening to your answer...');
        }

        async function stopRecording() {
            recognition.stop();
            isRecording = false;
            
            const speakBtn = document.getElementById('speakBtn');
            speakBtn.textContent = 'Speak';
            speakBtn.classList.remove('recording');

            if (currentTranscript.trim()) {
                addMessage('user', currentTranscript);
                updateStatus('processing', 'AI is thinking...');
                
                try {
                    const response = await fetch(`${API_URL}/interview/respond`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sessionId,
                            response: currentTranscript
                        })
                    });

                    const data = await response.json();
                    if (data.currentQuestionId) currentQuestionId = data.currentQuestionId;
                    const aiText = guidedFramework ? stripStepMarker(data.message) : data.message;
                    if (guidedFramework) {
                        const step = parseStepFromResponse(data.message);
                        if (step && step !== 'done') updateProgressTracker(step);
                    }
                    addMessage('ai', aiText);
                    speak(aiText);
                    hasResponded = true;
                    if (currentQuestionId) {
                        document.getElementById('sampleBtn').disabled = false;
                    }

                } catch (error) {
                    showError('Failed to send response: ' + error.message);
                    updateStatus('idle', 'Error');
                }
            } else {
                updateStatus('idle', 'No speech detected');
            }

            currentTranscript = '';
        }

        // Get Final Evaluation
        async function getEvaluation() {
            updateStatus('processing', 'Generating evaluation...');

            try {
                const response = await fetch(`${API_URL}/interview/evaluate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });

                const data = await response.json();
                addMessage('ai', '📊 FINAL EVALUATION:\n\n' + data.evaluation);
                speak(data.evaluation);

            } catch (error) {
                showError('Failed to get evaluation: ' + error.message);
                updateStatus('idle', 'Error');
            }
        }

        // End Interview
        async function endInterview() {
            if (confirm('Are you sure you want to end this interview?')) {
                try {
                    await fetch(`${API_URL}/interview/end`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId })
                    });
                    location.reload();
                } catch (error) {
                    console.error('Error ending interview:', error);
                    location.reload();
                }
            }
        }

        async function showSampleAnswer() {
            if (!currentQuestionId) return;
            const panel = document.getElementById('samplePanel');
            // Toggle off if already showing
            if (!panel.classList.contains('hidden')) {
                panel.classList.add('hidden');
                while (panel.firstChild) panel.removeChild(panel.firstChild);
                document.getElementById('sampleBtn').textContent = 'One strong approach';
                return;
            }
            document.getElementById('sampleBtn').disabled = true;
            document.getElementById('sampleBtn').textContent = 'Loading...';
            try {
                const res = await fetch(`${API_URL}/interview/question/${currentQuestionId}/sample`);
                const data = await res.json();
                renderSamplePanel(panel, data);
                panel.classList.remove('hidden');
                document.getElementById('sampleBtn').textContent = 'Hide sample';
                document.getElementById('sampleBtn').disabled = false;
            } catch (err) {
                showError('Failed to load sample answer.');
                document.getElementById('sampleBtn').textContent = 'One strong approach';
                document.getElementById('sampleBtn').disabled = false;
            }
        }

        function renderSamplePanel(panel, data) {
            while (panel.firstChild) panel.removeChild(panel.firstChild);

            const heading = document.createElement('h3');
            heading.textContent = 'One strong approach';
            panel.appendChild(heading);

            const subhead = document.createElement('p');
            subhead.style.cssText = 'color:#166534;font-size:12px;margin-bottom:10px;font-style:italic;';
            subhead.textContent = 'This is one path — not the only one. Your context may produce an equally strong answer.';
            panel.appendChild(subhead);

            // Key points
            const kpLabel = document.createElement('p');
            kpLabel.style.cssText = 'font-weight:700;color:#15803d;font-size:12px;margin-bottom:6px;';
            kpLabel.textContent = 'Key points to hit:';
            panel.appendChild(kpLabel);

            const ul = document.createElement('ul');
            ul.className = 'sample-key-points';
            data.keyPoints.forEach(pt => {
                const li = document.createElement('li');
                li.textContent = pt;
                ul.appendChild(li);
            });
            panel.appendChild(ul);

            // Walkthrough toggle
            const walkthroughDiv = document.createElement('div');
            walkthroughDiv.className = 'sample-walkthrough';
            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'sample-walkthrough-toggle';
            toggleBtn.textContent = 'See full walkthrough ↓';
            let open = false;
            const stepsDiv = document.createElement('div');
            stepsDiv.className = 'sample-walkthrough-steps hidden';
            const overview = document.createElement('p');
            overview.style.cssText = 'color:#166534;margin-bottom:10px;font-size:13px;';
            overview.textContent = data.sampleAnswer.overview;
            stepsDiv.appendChild(overview);
            data.sampleAnswer.steps.forEach((step, i) => {
                const s = document.createElement('div');
                s.className = 'sample-step';
                const num = document.createElement('span');
                num.style.cssText = 'font-weight:700;margin-right:6px;';
                num.textContent = (i + 1) + '.';
                s.appendChild(num);
                s.appendChild(document.createTextNode(step));
                stepsDiv.appendChild(s);
            });
            toggleBtn.addEventListener('click', () => {
                open = !open;
                stepsDiv.classList.toggle('hidden', !open);
                toggleBtn.textContent = open ? 'Hide walkthrough ↑' : 'See full walkthrough ↓';
            });
            walkthroughDiv.appendChild(toggleBtn);
            walkthroughDiv.appendChild(stepsDiv);
            panel.appendChild(walkthroughDiv);
        }

        // Text-to-Speech
        function speak(text) {
            synthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            utterance.onstart = () => {
                updateStatus('speaking', 'AI is speaking...');
            };

            utterance.onend = () => {
                updateStatus('idle', 'Waiting for your response');
            };

            synthesis.speak(utterance);
        }

        // UI Helper Functions
        function addMessage(role, text) {
            const conversation = document.getElementById('conversation');
            const message = document.createElement('div');
            message.className = `message ${role}`;
            const roleLabel = document.createElement('div');
            roleLabel.className = 'role';
            roleLabel.textContent = role === 'ai' ? 'AI Interviewer' : 'You';
            const body = document.createElement('div');
            body.textContent = text;
            message.appendChild(roleLabel);
            message.appendChild(body);
            conversation.appendChild(message);
            conversation.scrollTop = conversation.scrollHeight;

            if (role === 'ai') {
                lastAiMessage = text;
                document.getElementById('repeatBtn').disabled = false;
                document.getElementById('nextBtn').disabled = false;
            }
        }

        function repeatQuestion() {
            if (lastAiMessage) speak(lastAiMessage);
        }

        async function nextQuestion() {
            if (!sessionId) return;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('repeatBtn').disabled = true;
            document.getElementById('sampleBtn').disabled = true;
            const samplePanel = document.getElementById('samplePanel');
            samplePanel.classList.add('hidden');
            while (samplePanel.firstChild) samplePanel.removeChild(samplePanel.firstChild);
            hasResponded = false;
            updateStatus('processing', 'Getting next question...');
            try {
                const response = await fetch(`${API_URL}/interview/respond`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, response: "Please move on to the next question." })
                });
                const data = await response.json();
                if (data.currentQuestionId) currentQuestionId = data.currentQuestionId;
                addMessage('ai', data.message);
                speak(data.message);
            } catch (error) {
                showError('Failed to get next question: ' + error.message);
                updateStatus('idle', 'Error');
            }
        }

        function updateStatus(state, text) {
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            
            statusDiv.className = `status-indicator ${state}`;
            statusText.textContent = text;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 5000);
        }

        window.addEventListener('beforeunload', () => {
            if (synthesis) synthesis.cancel();
            if (recognition) recognition.stop();
        });
    </script>
</body>
